name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write # needed to create the pre-release

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Read Debug Keystore
      if: github.ref == 'refs/heads/master'
      # If the secret is not set (e.g. in a fork), an empty file would be written here and
      # Gradle would fail to read it. Skip it so that Gradle generates its own debug keystore.
      run: |
        if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
          mkdir -p ~/.config/.android/
          echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > ~/.config/.android/debug.keystore
        else
          echo "ANDROID_DEBUG_KEYSTORE is not set, using a generated debug keystore."
        fi
      env:
        ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: launcher-debug-${{ github.sha }}.apk
        path: app/build/outputs/apk/default/debug/app-default-debug.apk

    - name: Delete Old Pre-Release
      if: github.ref == 'refs/heads/master'
      # there is no pre-release yet on the first run
      run: gh release delete pre-release --cleanup-tag || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Create Pre-Release
      if: github.ref == 'refs/heads/master'
      uses: ncipollo/release-action@v1
      with:
        commit: ${{ github.sha }}
        tag: "pre-release"
        name: "Debug (only for testing)"
        prerelease: true
        body: "This debug build is updated automatically whenever there is a commit to master. It is signed with a debug certificate and uses the package name `de.jrpie.android.launcher.debug`. Furthermore, the app name is set to `µLauncher [debug]`. **Debug builds are not suited for everyday use.**"
        generateReleaseNotes: true
        removeArtifacts: true
        replacesArtifacts: true
        artifacts: "app/build/outputs/apk/default/debug/app-default-debug.apk"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
